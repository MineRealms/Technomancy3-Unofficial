pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
    create(rootProject) {
        // Node directory name -> logical version used by `//? if` conditions.
        versions(['1.20.1-forge': '1.20.1'])
        versions(['1.21.1-neoforge': '1.21.1'])
    }
}

rootProject.name = 'Technomancy'

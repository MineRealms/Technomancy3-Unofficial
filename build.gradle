plugins {
    id 'eclipse'
    id 'idea'
    id 'dev.kikugie.stonecutter'
    // Both loader plugin families come from ModDevGradle. They are declared here (apply false)
    // so that the per-node branch below can apply exactly one of them.
    id 'net.neoforged.moddev.legacyforge' version '2.0.148' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

// This file is Stonecutter's shared build script: it runs once per node.
def isForge = mod_loader == 'forge'

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}-${mod_loader}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())

def withGtceu = providers.gradleProperty('withGtceu').map { it.toBoolean() }.getOrElse(false)
def withJade = providers.gradleProperty('withJade').map { it.toBoolean() }.getOrElse(true)
def withKubejs = providers.gradleProperty('withKubejs').map { it.toBoolean() }.getOrElse(false)
def tc4Repository = file(providers.gradleProperty('tc4Repository')
        .getOrElse(rootProject.file('local-repo').absolutePath))

// Generated resources are per-node: a shared directory would let the two `runData` outputs
// overwrite each other (plan risk R8).
sourceSets.main.resources {
    srcDir rootProject.file(isForge ? 'src/generated/resources' : 'src/generated/resources-1.21.1')
}

// Optional local workaround; the project never sets a machine-specific proxy.
if (providers.gradleProperty('mavenCentralMirror').isPresent()) {
    repositories.configureEach { repo ->
        if (repo instanceof MavenArtifactRepository &&
                repo.url.toString().startsWith('https://repo.maven.apache.org')) {
            repo.setUrl(providers.gradleProperty('mavenCentralMirror').get())
        }
    }
}

if (isForge) {
    // ---------------------------------------------------------------- 1.20.1 / Forge (LegacyForge)
    apply plugin: 'net.neoforged.moddev.legacyforge'

    legacyForge {
        version = "${minecraft_version}-${forge_version}"

        runs {
            configureEach {
                gameDirectory = rootProject.file('run')
                systemProperty 'forge.logging.console.level', 'info'
                // LegacyForge sets `mixin.env.remapRefMap` and `mixin.env.refMapRemappingFile`
                // itself (pointing at its own `moddev/artifacts/intermediateToNamed.srg`), so the
                // single-version build's hand-written values must NOT be repeated here - a stale
                // path silently disables refmap remapping and every SRG-named dependency mixin
                // (e.g. TerraBlender's) fails to apply.
            }
            client {
                client()
                systemProperty 'technom.clientSmoke', providers.gradleProperty('clientSmoke').getOrElse('false')
                gameDirectory = rootProject.file('run-client')
                // Automated client testing needs a loaded world: the RosettaRemoteDebugBridge only
                // starts listening on ServerStartedEvent, which on a client means "a world was
                // joined", not "the title screen appeared". tools/client_probe.py passes this.
                if (project.hasProperty('quickPlay')) {
                    programArgument '--quickPlaySingleplayer'
                    programArgument project.property('quickPlay').toString()
                }
                // Its own bridge port, so a client and a dedicated server can be probed at once
                // without one of them failing to bind. Harmless when the bridge is not installed.
                systemProperty 'rosetta.remote.port', providers.gradleProperty('clientProbePort').getOrElse('48791')
            }
            server {
                server()
                gameDirectory = rootProject.file('run-server')
                programArgument '--nogui'
            }
            gameTestServer {
                type = 'gameTestServer'
                gameDirectory = rootProject.file('run-gametest')
                systemProperty 'forge.enabledGameTestNamespaces', mod_id
                // Lets GtceuIsolationGameTests assert that the flag really changed the runtime set.
                systemProperty 'technom.gametest.expectGtceu', withGtceu.toString()
            }
            data {
                data()
                gameDirectory = rootProject.file('run-data')
                programArgument '--mod'
                programArgument mod_id
                programArgument '--all'
                programArgument '--output'
                programArgument rootProject.file('src/generated/resources/').absolutePath
                programArgument '--existing'
                programArgument rootProject.file('src/main/resources/').absolutePath
            }
        }

        mods {
            technom {
                sourceSet sourceSets.main
            }
        }

        // LegacyForge has no `unitTest { }` block (that is NeoForge-only), so the JUnit suite has to
        // be given the modding classpath explicitly. Without this the `test` source set sees only
        // `implementation` (the remapped mod jars) and none of Minecraft/Forge - `compileTestJava`
        // then fails on every vanilla import.
        addModdingDependenciesTo sourceSets.test
    }

    repositories {
        maven {
            name = 'LocalTC4R'
            url = uri(tc4Repository)
            content { includeGroup 'dev.tc4port' }
        }
        maven { url = 'https://maven.gtceu.com' }
        maven { url = 'https://maven.firstdark.dev/snapshots' }
        maven { url = 'https://maven.tterrag.com' }
        maven { url = 'https://maven.theillusivec4.top' }
        // Botania (and its API) and JEI are published here.
        maven { url = 'https://maven.blamejared.com' }
        // Jade is published on the Modrinth maven, which mirrors every project file.
        maven {
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
        // KubeJS.
        maven { url = 'https://maven.latvian.dev/releases' }
        // Architectury, which KubeJS declares mandatory alongside Rhino.
        maven { url = 'https://maven.architectury.dev' }
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://modmaven.dev' }
        mavenCentral()
    }

    dependencies {
        // ModDevGradle's mod* configurations remap SRG -> official and are non-transitive, which is
        // exactly the semantics ForgeGradle's `fg.deobf(..., { transitive = false })` had.
        modImplementation("dev.tc4port:thaumcraft-forge:${thaumcraft_version}") { transitive = false }
        modRuntimeOnly("top.theillusivec4.curios:curios-forge:${curios_version}") { transitive = false }
        modRuntimeOnly("com.github.glitchfiend:TerraBlender-forge:${terrablender_version}") {
            transitive = false
        }

        // One compile API for all builds. The flag only changes the development runtime.
        modCompileOnly("com.gregtechceu.gtceu:gtceu-1.20.1:${gtceu_version}") { transitive = false }
        modCompileOnly("com.lowdragmc.ldlib:ldlib-forge-1.20.1:${ldlib_version}") {
            transitive = false
            exclude group: 'appeng', module: 'appliedenergistics2-forge'
        }
        modCompileOnly("com.tterrag.registrate:Registrate:${registrate_version}") { transitive = false }

        if (withGtceu) {
            modRuntimeOnly("com.gregtechceu.gtceu:gtceu-1.20.1:${gtceu_version}") { transitive = false }
            // LDLib, Registrate and Configuration are embedded by GTCEu.
        }

        // Botania module (Forge node only): the API is always on the compile path and the mod itself
        // on the dev runtime, because Botania is a hard dependency there. The machines register
        // unconditionally and reference the API at class load, so a runtime without Botania would not
        // even parse the loot tables. Botania declares Patchouli (and Curios, already above) as
        // mandatory too, so both must be on the dev runtime or the game refuses to start. The
        // NeoForge node has no Botania port and excludes the module from the source set entirely.
        modCompileOnly("vazkii.botania:Botania:${botania_version}")
        modRuntimeOnly("vazkii.botania:Botania:${botania_version}") { transitive = false }
        modRuntimeOnly("vazkii.patchouli:Patchouli:${patchouli_version}") { transitive = false }
        // JEI: compileOnly for the plugin, runtimeOnly so dev shows recipes.
        modCompileOnly("mezz.jei:jei-1.20.1-forge:${jei_version}")
        modRuntimeOnly("mezz.jei:jei-1.20.1-forge:${jei_version}")
        // Jade. Unlike JEI its plugin loads on BOTH sides, so the plugin class is common code and
        // the runtime dependency is gated: set -PwithJade=false to run the development game
        // without Jade and exercise the absent path.
        modCompileOnly("maven.modrinth:jade:${jade_version}") { transitive = false }
        if (withJade) {
            modRuntimeOnly("maven.modrinth:jade:${jade_version}") { transitive = false }
        }
        // KubeJS: compileOnly by default, deliberately. It is a scripting engine, so leaving it out
        // of the normal development runtime keeps startup and the resource reload identical for every
        // test in the suite. Its plugin is discovered from the kubejs.plugins.txt resource at the jar
        // root, so an absent KubeJS never reads that file and never loads the class. Set
        // -PwithKubejs=true to install it for real and exercise the plugin; Rhino and Architectury
        // are mods rather than libraries and KubeJS declares both mandatory, so they come with it.
        modCompileOnly("dev.latvian.mods:kubejs-forge:${kubejs_version}") { transitive = false }
        if (withKubejs) {
            modRuntimeOnly("dev.latvian.mods:kubejs-forge:${kubejs_version}") { transitive = false }
            modRuntimeOnly("dev.latvian.mods:rhino-forge:${rhino_version}") { transitive = false }
            modRuntimeOnly("dev.architectury:architectury-forge:${architectury_version}") {
                transitive = false
            }
        }

        testImplementation(platform("org.junit:junit-bom:${junit_version}"))
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('processResources', ProcessResources).configure {
        def values = [minecraft_version_range: minecraft_version_range,
                forge_version_range: forge_version_range, loader_version_range: loader_version_range,
                mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                mod_authors: mod_authors, mod_description: mod_description,
                thaumcraft_runtime_version: thaumcraft_runtime_version, gtceu_version: gtceu_version, botania_version: botania_version]
        inputs.properties values
        filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand values }
    }

    tasks.named('jar', Jar).configure {
        // GameTests and their templates only exist for the dev runs; never ship them.
        exclude 'theflogat/technomancy/gametest/**'
        exclude 'data/technom/structures/gametest/**'
        // Forge 1.20.1 has no `[[mixins]]` support in mods.toml; the only registration point is the
        // `MixinConfigs` manifest attribute (read by Mixin's MixinPlatformAgentDefault). The dev runs
        // load the mod from `build/resources/main` as an exploded directory, so the same attribute is
        // also shipped as a resource - drop it here so the generated manifest is the one that lands
        // in the jar.
        exclude 'META-INF/MANIFEST.MF'
        manifest {
            attributes('Specification-Title': mod_name, 'Specification-Vendor': mod_authors,
                    'Specification-Version': '1',
                    // `project.name` is the Stonecutter node name (e.g. `1.20.1-forge`), so build the
                    // human-facing title from the root project name plus the logical MC version;
                    // this reproduces the single-version build's `Technomancy-1.20.1`.
                    'Implementation-Title': "${rootProject.name}-${sc.current.version}",
                    'Implementation-Version': project.version, 'Implementation-Vendor': mod_authors,
                    'MixinConfigs': "${mod_id}.mixins.json")
        }
        // The licence files live at the repository root, not in the node directory.
        from([rootProject.file('LICENSE'), rootProject.file('NOTICE')]) { into 'META-INF' }
    }
} else {
    // ---------------------------------------------------------------- 1.21.1 / NeoForge
    apply plugin: 'net.neoforged.moddev'
    apply from: rootProject.file('gradle/neoforge-resources.gradle')

    sourceSets.main.java {
        exclude 'theflogat/technomancy/common/blocks/botania/**'
        exclude 'theflogat/technomancy/common/tiles/botania/**'
        exclude 'theflogat/technomancy/common/blocks/machines/BoProcessorBlock.java'
        exclude 'theflogat/technomancy/common/tiles/machines/BoProcessorBlockEntity.java'
        exclude 'theflogat/technomancy/compat/botania/BotaniaContent.java'
        exclude 'theflogat/technomancy/gametest/ManaExchangerBotaniaTests.java'
        exclude 'theflogat/technomancy/mixin/GtceuJeiFluidHelperMixin.java'
    }

    neoForge {
        version = neo_version

        parchment {
            minecraftVersion = minecraft_version
            mappingsVersion = parchment_mappings
        }

        runs {
            configureEach {
                gameDirectory = rootProject.file('run')
                systemProperty 'forge.logging.console.level', 'info'
            }
            client {
                client()
                systemProperty 'technom.clientSmoke', providers.gradleProperty('clientSmoke').getOrElse('false')
                gameDirectory = rootProject.file('run-client-1.21.1')
                if (project.hasProperty('quickPlay')) {
                    programArgument '--quickPlaySingleplayer'
                    programArgument project.property('quickPlay').toString()
                }
                // R9: the two nodes must not share a bridge port. 1.20.1 owns 48791.
                systemProperty 'rosetta.remote.port', providers.gradleProperty('clientProbePort').getOrElse('48792')
            }
            server {
                server()
                gameDirectory = rootProject.file('run-server-1.21.1')
                programArgument '--nogui'
            }
            gameTestServer {
                // MDG's RunModel has no `gameTestServer()` helper; the type is set by name.
                type = 'gameTestServer'
                gameDirectory = rootProject.file('run-gametest-1.21.1')
                // NeoForge renamed the Forge `forge.*` system properties to `neoforge.*`.
                systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
                systemProperty 'technom.gametest.expectGtceu', withGtceu.toString()
            }
            data {
                data()
                gameDirectory = rootProject.file('run-data-1.21.1')
                programArgument '--mod'
                programArgument mod_id
                programArgument '--all'
                programArgument '--output'
                programArgument rootProject.file('src/generated/resources-1.21.1/').absolutePath
                programArgument '--existing'
                programArgument rootProject.file('src/main/resources/').absolutePath
            }
        }

        mods {
            technom {
                sourceSet sourceSets.main
            }
        }

        // Unlike legacyforge, the NeoForge extension does have `unitTest`: it wires the modding
        // classpath and the mod's own test resources into the `test` source set for us.
        unitTest {
            enable()
            testedMod = mods.technom
        }
    }

    repositories {
        maven {
            name = 'LocalTC4R'
            url = uri(tc4Repository)
            content { includeGroup 'dev.tc4port' }
        }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.blamejared.com' }
        maven { url = 'https://maven.theillusivec4.top' }
        maven {
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
        maven { url = 'https://maven.gtceu.com' }
        maven { url = 'https://maven.latvian.dev/releases' }
        maven { url = 'https://maven.architectury.dev' }
        mavenCentral()
    }

    dependencies {
        // Core ModDevGradle has no `mod*` configurations - those are a legacyforge addition. On
        // 1.21.1 that is fine: NeoForge runs in official mappings, so nothing needs remapping and
        // the ordinary configurations carry mods just as well.
        implementation("dev.tc4port:thaumcraft-neoforge:${thaumcraft_version}") { transitive = false }
        runtimeOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}") { transitive = false }
        // Pin the official Modrinth file, whose Maven version number is otherwise ambiguous across loaders.
        runtimeOnly("maven.modrinth:terrablender:${terrablender_file}") { transitive = false }

        compileOnly("com.gregtechceu.gtceu:gtceu-1.21.1:${gtceu_version}") { transitive = false }
        if (withGtceu) {
            runtimeOnly("com.gregtechceu.gtceu:gtceu-1.21.1:${gtceu_version}") { transitive = false }
        }

        compileOnly("mezz.jei:jei-1.21.1-neoforge:${jei_version}")
        runtimeOnly("mezz.jei:jei-1.21.1-neoforge:${jei_version}")
        compileOnly("maven.modrinth:jade:${jade_version}") { transitive = false }
        if (withJade) {
            runtimeOnly("maven.modrinth:jade:${jade_version}") { transitive = false }
        }
        compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
        if (withKubejs) {
            runtimeOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
            runtimeOnly("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
        }
        // Botania has no 1.21.1 build, so the optional Botania module is 1.20.1-only for now.

        testImplementation(platform("org.junit:junit-bom:${junit_version}"))
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

// Process test sources using the same target rules as production sources.
stonecutter.tasks.configureSource(sourceSets.test)

// ---------------------------------------------------------------- shared by both nodes
// These live outside the per-node branch because neither is toolchain-specific: the guard tests and
// the TC4R integrity check apply to 1.20.1 and 1.21.1 alike.

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // Several guard tests read their inputs as paths relative to the repository root
    // (`src/main/java/...`). The sources live at the root, one level above the node project, so
    // pin the working directory to the root to preserve the single-version build's behaviour.
    workingDir = rootProject.projectDir
    systemProperty 'technom.sourceRoot', (isForge ? rootProject.file('src/main/java')
            : layout.buildDirectory.dir('generated/stonecutter/main/java').get().asFile).absolutePath
    systemProperty 'technom.resourceRoot', layout.buildDirectory.dir('resources/main').get().asFile.absolutePath
    systemProperty 'technom.loader', mod_loader
    testLogging { events 'failed'; exceptionFormat 'full' }
}

tasks.register('verifyLocalDependencies') {
    group = 'verification'
    description = 'Checks supplied TC4R artifacts against the recorded SHA-256 hashes.'
    doLast {
        // Each node has its own artifact set. `DEPENDENCIES.json` is the 1.20.1 manifest the
        // existing bootstrap script and CI still reference, so it keeps its name; a node-qualified
        // file takes precedence when one exists.
        def nodeManifest = rootProject.file("local-repo/DEPENDENCIES.${sc.current.project}.json")
        def manifestFile = nodeManifest.isFile() ? nodeManifest
                : rootProject.file('local-repo/DEPENDENCIES.json')
        def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
        manifest.artifacts.each { artifact ->
            def target = new File(tc4Repository, artifact.path)
            if (!target.isFile()) {
                throw new GradleException("Missing ${target}. Run tools/bootstrap-local-deps.ps1; see local-repo/README.md.")
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(target.bytes).encodeHex().toString()
            if (digest != artifact.sha256) {
                throw new GradleException("TC4R checksum mismatch: ${target.name}. Keep the version and manifest in sync.")
            }
        }
        logger.lifecycle("Verified ${manifest.artifacts.size()} TC4R artifacts for ${sc.current.project} via ${manifestFile.name}")
    }
}
tasks.named('compileJava').configure { dependsOn 'verifyLocalDependencies' }
tasks.named('check').configure { dependsOn 'verifyLocalDependencies' }

tasks.register('verifyTargetJar', Exec) {
    group = 'verification'
    dependsOn 'jar'
    if (isForge) dependsOn 'reobfJar'
    def artifact = layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}.jar")
    inputs.file(artifact)
    inputs.file(rootProject.file('tools/check_target_jar.py'))
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python'),
            rootProject.file('tools/check_target_jar.py').absolutePath,
            artifact.get().asFile.absolutePath, '--node', sc.current.project
}
tasks.named('build').configure { dependsOn 'verifyTargetJar' }

// A NeoForge mod-loading failure can return exit code zero. Require evidence that
// the server actually ran tests, rather than accepting the Java process status alone.
tasks.named('runGameTestServer').configure {
    doFirst { ext.verificationStartedAt = System.currentTimeMillis() }
    doLast {
        def log = rootProject.file(isForge ? 'run-gametest/logs/latest.log'
                : 'run-gametest-1.21.1/logs/latest.log')
        if (!log.isFile() || log.lastModified() < verificationStartedAt - 1000L) {
            throw new GradleException('GameTest produced no fresh server log')
        }
        def text = log.getText('UTF-8')
        def completed = text =~ /(\d+) GAME TESTS COMPLETE/
        def passed = text =~ /All (\d+) required tests passed/
        if (!completed.find() || !passed.find() || completed.group(1).toInteger() <= 0
                || text.contains('required tests failed') || text.contains('Failed to start the minecraft server')) {
            throw new GradleException("GameTest did not report a completed passing test suite; inspect ${log}")
        }
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}

name: Build

# TC4R is supplied privately. The archive must contain both nodes' artifacts under
# dev/tc4port and match the checked-in SHA-256 manifests; it is never uploaded.
on:
  push:
    branches: [main, multiversion]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate canonical data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/validate_technom_data.py

  build:
    name: Build (${{ matrix.node }})
    needs: validate
    if: ${{ vars.TC4R_ARCHIVE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [1.20.1-forge, 1.21.1-neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up toolchains and private dependencies
        uses: ./.github/actions/forge-setup
        with:
          tc4r-archive-url: ${{ vars.TC4R_ARCHIVE_URL }}
          tc4r-archive-token: ${{ secrets.TC4R_ARCHIVE_TOKEN }}
      - name: Build, unit test and inspect release jar
        run: ./gradlew :${{ matrix.node }}:build --console=plain --no-daemon
      - name: Validate target data
        run: python tools/validate_technom_data.py --node ${{ matrix.node }}
      - uses: actions/upload-artifact@v4
        with:
          name: technom-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/libs/*.jar
          if-no-files-found: error
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/reports/tests/

  gametest:
    name: GameTest (${{ matrix.node }}, ${{ matrix.runtime }})
    needs: build
    if: ${{ vars.TC4R_ARCHIVE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 1.20.1-forge
            runtime: default
            args: ''
          - node: 1.20.1-forge
            runtime: gtceu
            args: '-PwithGtceu=true'
          - node: 1.20.1-forge
            runtime: no-botania
            args: '-PwithBotania=false'
          - node: 1.21.1-neoforge
            runtime: default
            args: ''
          - node: 1.21.1-neoforge
            runtime: kubejs
            args: '-PwithKubejs=true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ./.github/actions/forge-setup
        with:
          tc4r-archive-url: ${{ vars.TC4R_ARCHIVE_URL }}
          tc4r-archive-token: ${{ secrets.TC4R_ARCHIVE_TOKEN }}
      - name: Run isolated game tests
        run: ./gradlew :${{ matrix.node }}:runGameTestServer --console=plain --no-daemon ${{ matrix.args }}
      - name: Validate against the target's live inventory
        if: matrix.runtime == 'default'
        run: python tools/validate_technom_data.py --node ${{ matrix.node }} --require-inventory

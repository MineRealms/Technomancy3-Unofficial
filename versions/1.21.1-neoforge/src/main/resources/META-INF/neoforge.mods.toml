modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="technomancy.png"
credits="Original Technomancy by Democretes, theflogat and Mordenkainen. Unofficial modern port."
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="thaumcraft"
type="required"
versionRange="[${thaumcraft_runtime_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="gtceu"
type="optional"
versionRange="[${gtceu_version}]"
ordering="AFTER"
side="BOTH"
